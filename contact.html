									<blockquote style="padding:0; "><h4>　CONTACT > 문의남기기</h4></blockquote>
									<blockquote style="padding:0; ">
										<h6>　건의사항 및 오류 관련 문의, 기타 프로젝트 문의 남겨주세요.<br></h6>

									<section>
										<!-- <form role="form" action="https://formspree.io/f/mvzgvbeq" method="POST" enctype="multipart/form-data"> -->

											<div class="row gtr-uniform gtr-50 contact-form">

												<div class="col-3 col-12-small">
													<select name="category" id="category" required>
														<option value="">- 카테고리 선택 -</option>
														<option value="App">App</option>
														<option value="Web">Web</option>
														<option value="etc">기타문의</option>
													</select>
												</div>

												<div class="col-3 col-12-small">
													<input type="text" name="memberId" id="memberId" placeholder="작성자 / 이메일" required />

													<input type="file" name="files" id="files" />
												</div> -->

												<div class="col-12">
													<input type="text" name="title" id="title" placeholder="제목을 입력하세요" required />
												</div>

												<div class="col-12">
													<textarea name="content" id="content" rows="6" placeholder="내용을 입력하세요" style="resize:none;" minlength="20" required></textarea>
												</div>

												<div class="col-12">
													<input type="checkbox" id="pub" name="pub">
													<label for="pub">비공개</label>
												</div>

													<ul class="actions contact-actions">
														<li><input type="submit" value="전송" class="button primary small" /></li>
