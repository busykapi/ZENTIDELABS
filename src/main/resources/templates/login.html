<!DOCTYPE HTML>
<html lang="ko" xmlns="http://www.w3.org/1999/html" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="layout/layout">
    <head>
        <title>YZ Tour : 로그인</title>
        <meta charset="utf-8">
       <!-- <link th:href="@{/css/bootstrap.min.css}"
              href="../css/bootstrap.min.css" rel="stylesheet">-->
        <style>
            .field-error {
            border-color: #dc3545;
            color: #dc3545;
            }
        </style>
    </head>
<th:block layout:fragment="content">
    <body class="is-preload">
        <div id="page-wrapper">
            <!-- Main -->
                <div id="main" class="wrapper style1">
                    <div class="container" align="center" style="background:#29292e;border-radius:50px;"><br/>
                        <header class="major">
                            <h2 style="margin:0;">로그인</h2>
                        </header><br/>

                        <form th:action="@{/login}" method="post" autocomplete="off" novalidate>
                            <div>
                                <input type="text" id="userId" size="2" placeholder="아이디를 입력하세요" maxlength="10" style="width:40%;" required/>
                            </div>
                            <div>
                                <input type="password" id="pwd" size="2" placeholder="비밀번호 8자리를 입력하세요" maxlength="8" style="width:40%;" required/>
                            </div><br/>
                            <div class="col-6 col-12-medium">
                                <input type="checkbox" id="human" name="human" >
                                <label for="human" >아이디 저장</label>　　　　　　　　　　　　　　　　　　　
                            </div><br/>
                            <input type="submit" class="button primary small" onclick="login()" value="로그인" style="width:40%;" /><br/><br/>
                            <a href="">아이디 찾기</a> ㅣ
                            <a href="">비밀번호 찾기</a> ㅣ
                            <a href="">회원가입</a><br/><br/><br/>
                        </form>

                    </div><br/><br/><br/><br/>

                </div>
        </div>
    </body>
</th:block>
</html>
